{% extends "base.html" %}
{% block title %}Delete entry — DevVault{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg px-6 py-16">
  <section class="glass-panel delete-confirmation" aria-labelledby="delete-entry-heading" aria-describedby="delete-entry-description">
    <span class="delete-warning-icon" aria-hidden="true">!</span>
    <p class="page-eyebrow">Permanent action</p>
    <h1 id="delete-entry-heading" class="page-heading">Delete this entry?</h1>
    <p id="delete-entry-description" class="delete-description">“{{ object.title }}” and its comments will be permanently deleted. This can’t be undone.</p>
    <form method="post" class="delete-actions">
      {% csrf_token %}
      <a href="{{ object.get_absolute_url }}" class="button-secondary">Keep entry</a>
      <button type="submit" class="button-danger">Delete entry</button>
    </form>
  </section>
</div>
{% endblock %}
